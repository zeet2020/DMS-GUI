name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.8.1
  GO_VERSION: '1.22'
  NODE_VERSION: '24'
  # Run the JS-based actions (checkout/setup-*/upload-artifact) on Node 24
  # instead of the deprecated Node 20 runtime they bundle.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          # Wails v2.8.1 hardcodes pkg-config "webkit2gtk-4.0", but 4.0 is gone
          # on Ubuntu 24.04/26.04. Overwrite the 4.0 .pc with a shim that
          # Requires webkit2gtk-4.1, so the binary links 4.1 and bakes the 4.1
          # helper path. printf (not a heredoc) avoids any YAML indentation in
          # the generated .pc.
          PCDIR=$(pkg-config --variable pcfiledir gtk+-3.0)
          printf 'Name: webkit2gtk-4.0\nDescription: shim to webkit2gtk-4.1\nVersion: 2.40.0\nRequires: webkit2gtk-4.1\n' \
            | sudo tee "$PCDIR/webkit2gtk-4.0.pc" >/dev/null
          pkg-config --exists webkit2gtk-4.0 && echo "shim ok: $(pkg-config --libs webkit2gtk-4.0)"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build app
        run: wails build -platform ${{ matrix.platform }} -clean -trimpath

      # ---- Linux: package as a thin AppImage --------------------------------
      # Bundle ONLY the app binary + desktop integration and use the host's
      # gtk3 + webkit2gtk-4.1 (present on Ubuntu 22.04-26.04). Bundling glib/
      # gtk/webkit causes version skew that kills the WebKit render process
      # (blank window), so we deliberately don't.
      - name: Package AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APP=dms-gui
          APPDIR="${APP}.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          cp "build/bin/${APP}" "${APPDIR}/usr/bin/${APP}"

          cp build/appicon.png "${APPDIR}/${APP}.png"
          install -Dm644 build/appicon.png "${APPDIR}/usr/share/icons/hicolor/512x512/apps/${APP}.png"

          install -Dm644 /dev/stdin "${APPDIR}/usr/share/applications/${APP}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=DMS
          Comment=UPnP/DLNA media server
          Exec=${APP}
          Icon=${APP}
          Categories=AudioVideo;Network;
          Terminal=false
          EOF
          cp "${APPDIR}/usr/share/applications/${APP}.desktop" "${APPDIR}/${APP}.desktop"

          cat > "${APPDIR}/AppRun" <<'RUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "${HERE}/usr/bin/dms-gui" "$@"
          RUN
          chmod +x "${APPDIR}/AppRun"

          curl -fsSL --retry 3 --retry-all-errors -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64
          ./appimagetool --appimage-extract-and-run "${APPDIR}" "${APP}-x86_64.AppImage"

          mkdir -p dist
          mv "${APP}-x86_64.AppImage" "dist/${APP}-x86_64.AppImage"
          # also keep the plain dynamically-linked executable
          cp "build/bin/${APP}" "dist/${APP}-linux-amd64"

      # ---- macOS: zip the .app bundle ----------------------------------------
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent "build/bin/dms-gui.app" "dist/dms-gui-macos-universal.zip"

      # ---- Windows: keep the portable exe ------------------------------------
      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "build/bin/dms-gui.exe" "dist/dms-gui-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dms-gui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
