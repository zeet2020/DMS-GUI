name: build

on:
  push:
    branches: [main, wails3-migration]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS3_VERSION: v3.0.0-alpha2.117
  GO_VERSION: '1.25'
  NODE_VERSION: '24'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: windows-amd64
            os: windows-latest
          - name: macos-universal
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3 targets GTK4 + WebKitGTK 6.0 on Linux (the old webkit2gtk-4.0
      # pkg-config shim the v2 build needed is gone). Both are present on
      # Ubuntu 24.04+.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      # The Taskfile build pipeline regenerates bindings, builds the frontend,
      # generates icons and compiles the Go binary.

      # ---- Linux: build + AppImage -------------------------------------------
      # wails3's appimage generator bundles GTK4/WebKitGTK, so the image is large
      # (~130MB) but self-contained. Also ship the plain dynamically-linked binary.
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          wails3 task linux:create:appimage
          mkdir -p dist
          cp bin/dms-gui dist/dms-gui-linux-amd64
          cp bin/*.AppImage dist/dms-gui-x86_64.AppImage

      # ---- macOS: package universal .app bundle and zip it -------------------
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          wails3 task darwin:package:universal
          mkdir -p dist
          ditto -c -k --keepParent "bin/dms-gui.app" "dist/dms-gui-macos-universal.zip"

      # ---- Windows: portable exe ---------------------------------------------
      - name: Build Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          wails3 task build
          mkdir -p dist
          cp bin/dms-gui.exe dist/dms-gui-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dms-gui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
