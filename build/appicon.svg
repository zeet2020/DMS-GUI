<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b7285"/>
      <stop offset="55%" stop-color="#1098ad"/>
      <stop offset="100%" stop-color="#22b8cf"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- streaming / broadcast waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="30">
    <path d="M 385.7 290.6 A 220 220 0 0 1 638.3 290.6" opacity="0.45"/>
    <path d="M 425.9 322.1 A 150 150 0 0 1 598.1 322.1" opacity="0.65"/>
    <path d="M 466.1 353.6 A 80 80 0 0 1 557.9 353.6" opacity="0.9"/>
  </g>
  <circle cx="512" cy="410" r="27" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="512" y="730" text-anchor="middle"
        font-family="'Noto Sans', 'DejaVu Sans', sans-serif"
        font-weight="bold" font-size="290" letter-spacing="6"
        fill="#ffffff">DMS</text>
